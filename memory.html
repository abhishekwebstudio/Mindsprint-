<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Memory Cards | MindSprint</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
background:#f4f7ff;
color:#172033;
text-align:center
}
nav{
background:white;
padding:16px;
box-shadow:0 2px 10px #ddd
}
nav a{
text-decoration:none;
font-size:22px;
font-weight:bold;
color:#3157d5
}
.container{
max-width:500px;
margin:25px auto;
padding:15px
}
.info{
display:flex;
justify-content:space-around;
margin:20px 0
}
.box{
background:white;
padding:10px 18px;
border-radius:8px
}
#game{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
width:min(92vw,420px);
margin:auto
}
.card{
aspect-ratio:1;
background:#3157d5;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
cursor:pointer;
color:transparent
}
.card.open,
.card.matched{
background:white;
color:#172033;
border:2px solid #3157d5
}
button{
margin:18px 5px;
padding:11px 18px;
border:0;
border-radius:7px;
background:#3157d5;
color:white;
cursor:pointer
}
#message{
min-height:25px;
font-weight:bold
}
.home{
display:inline-block;
margin-top:10px;
padding:10px 18px;
background:#172033;
color:white;
text-decoration:none;
border-radius:7px
}
</style>
</head>

<body>

<nav>
<a href="index.html">MindSprint</a>
</nav>

<div class="container">

<h1>Memory Cards</h1>
<p>Find all matching pairs.</p>

<div class="info">
<div class="box">Moves<br><b id="moves">0</b></div>
<div class="box">Pairs<br><b id="pairs">0</b>/8</div>
<div class="box">Time<br><b id="time">00:00</b></div>
</div>

<div id="game"></div>

<button onclick="newGame()">New Game</button>

<div id="message"></div>

<a class="home" href="index.html">← Back to MindSprint</a>

</div>

<script>

const symbols=["🍎","🍌","🍇","🍉","🍓","🍒","🥝","🍍"];

let cards=[];
let first=null;
let second=null;
let lock=false;
let moves=0;
let pairs=0;
let seconds=0;
let timer;

function newGame(){

clearInterval(timer);

cards=[...symbols,...symbols]
.sort(()=>Math.random()-0.5);

first=null;
second=null;
lock=false;
moves=0;
pairs=0;
seconds=0;

document.getElementById("moves").textContent=0;
document.getElementById("pairs").textContent=0;
document.getElementById("time").textContent="00:00";
document.getElementById("message").textContent="";

draw();
startTimer();

}

function draw(){

let game=document.getElementById("game");
game.innerHTML="";

cards.forEach((symbol,index)=>{

let card=document.createElement("div");

card.className="card";
card.dataset.index=index;
card.textContent=symbol;

card.onclick=()=>flip(index,card);

game.appendChild(card);

});

}

function flip(index,card){

if(lock)return;
if(card.classList.contains("open"))return;
if(card.classList.contains("matched"))return;

card.classList.add("open");

if(first===null){

first=index;

}else{

second=index;
moves++;

document.getElementById("moves").textContent=moves;

let all=document.querySelectorAll(".card");
let firstCard=all[first];

if(cards[first]===cards[second]){

firstCard.classList.add("matched");
card.classList.add("matched");

first=null;
second=null;

pairs++;

document.getElementById("pairs").textContent=pairs;

if(pairs===8){

clearInterval(timer);

document.getElementById("message").textContent=
"🎉 Congratulations! You found all pairs!";

}

}else{

lock=true;

setTimeout(()=>{

firstCard.classList.remove("open");
card.classList.remove("open");

first=null;
second=null;
lock=false;

},700);

}

}

}

function startTimer(){

timer=setInterval(()=>{

seconds++;

let m=Math.floor(seconds/60);
let s=seconds%60;

document.getElementById("time").textContent=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

},1000);

}

newGame();

</script>

</body>
</html>
