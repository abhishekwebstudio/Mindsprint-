<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2048 | MindSprint</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
background:#f4f7ff;
color:#172033;
text-align:center
}
nav{
background:white;
padding:16px;
box-shadow:0 2px 10px #ddd
}
nav a{
text-decoration:none;
font-size:22px;
font-weight:bold;
color:#3157d5
}
.container{
max-width:500px;
margin:25px auto;
padding:15px
}
h1{margin-bottom:5px}
.info{
display:flex;
justify-content:space-around;
margin:20px 0
}
.box{
background:white;
padding:10px 20px;
border-radius:8px
}
#game{
width:min(92vw,450px);
height:min(92vw,450px);
margin:auto;
padding:10px;
background:#bbada0;
border-radius:10px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px
}
.tile{
background:#cdc1b4;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(24px,8vw,42px);
font-weight:bold
}
button{
margin:15px 5px;
padding:11px 18px;
border:0;
border-radius:7px;
background:#3157d5;
color:white;
cursor:pointer
}
.home{
display:inline-block;
margin-top:10px;
padding:10px 18px;
background:#172033;
color:white;
text-decoration:none;
border-radius:7px
}
#message{
font-weight:bold;
min-height:25px
}
</style>
</head>

<body>

<nav>
<a href="index.html">MindSprint</a>
</nav>

<div class="container">

<h1>2048</h1>
<p>Combine the numbers and reach 2048!</p>

<div class="info">
<div class="box">Score<br><b id="score">0</b></div>
<div class="box">Best<br><b id="best">0</b></div>
</div>

<div id="game"></div>

<button onclick="newGame()">New Game</button>

<div id="message"></div>

<p>Use arrow keys or swipe on mobile.</p>

<a class="home" href="index.html">← Back to MindSprint</a>

</div>

<script>

let board=[];
let score=0;
let best=Number(localStorage.getItem("ms2048best")||0);

document.getElementById("best").textContent=best;

function newGame(){

board=Array(16).fill(0);
score=0;
document.getElementById("message").textContent="";

addTile();
addTile();
draw();

}

function addTile(){

let empty=[];

for(let i=0;i<16;i++)
if(board[i]==0)empty.push(i);

if(!empty.length)return;

let i=empty[Math.floor(Math.random()*empty.length)];

board[i]=Math.random()<0.9?2:4;

}

function draw(){

let game=document.getElementById("game");
game.innerHTML="";

board.forEach(n=>{

let tile=document.createElement("div");
tile.className="tile";
tile.textContent=n||"";

game.appendChild(tile);

});

document.getElementById("score").textContent=score;

if(score>best){

best=score;
localStorage.setItem("ms2048best",best);
document.getElementById("best").textContent=best;

}

}

function move(direction){

let old=board.join(",");

for(let r=0;r<4;r++){

let line=[];

for(let c=0;c<4;c++){

let i=direction=="left"?
r*4+c:
direction=="right"?
r*4+(3-c):
direction=="up"?
c*4+r:
(3-c)*4+r;

line.push(board[i]);

}

line=line.filter(x=>x);

for(let i=0;i<line.length-1;i++){

if(line[i]==line[i+1]){

line[i]*=2;
score+=line[i];
line[i+1]=0;

}

}

line=line.filter(x=>x);

while(line.length<4)line.push(0);

for(let c=0;c<4;c++){

let i=direction=="left"?
r*4+c:
direction=="right"?
r*4+(3-c):
direction=="up"?
c*4+r:
(3-c)*4+r;

board[i]=line[c];

}

}

if(board.join(",")!=old){

addTile();
draw();
checkGame();

}

}

function checkGame(){

if(board.includes(2048)){
document.getElementById("message").textContent=
"🎉 You reached 2048!";
return;
}

if(board.includes(0))return;

for(let r=0;r<4;r++){
for(let c=0;c<4;c++){

let i=r*4+c;

if(c<3 && board[i]==board[i+1])return;
if(r<3 && board[i]==board[i+4])return;

}
}

document.getElementById("message").textContent=
"Game Over!";

}

document.addEventListener("keydown",e=>{

if(e.key=="ArrowLeft")move("left");
if(e.key=="ArrowRight")move("right");
if(e.key=="ArrowUp")move("up");
if(e.key=="ArrowDown")move("down");

});

let startX=0,startY=0;

document.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

});

document.addEventListener("touchend",e=>{

let x=e.changedTouches[0].clientX;
let y=e.changedTouches[0].clientY;

let dx=x-startX;
let dy=y-startY;

if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;

if(Math.abs(dx)>Math.abs(dy))
move(dx>0?"right":"left");
else
move(dy>0?"down":"up");

});

newGame();

</script>

</body>
</html>
