<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arrow Puzzle | MindSprint</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
background:#f4f7ff;
color:#172033;
text-align:center
}
nav{
background:white;
padding:16px;
box-shadow:0 2px 10px #ddd
}
nav a{
text-decoration:none;
font-size:22px;
font-weight:bold;
color:#3157d5
}
.container{
max-width:500px;
margin:25px auto;
padding:15px
}
#arrow{
background:white;
width:220px;
height:220px;
margin:30px auto;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
box-shadow:0 3px 15px #ddd
}
.info{
display:flex;
justify-content:space-around;
margin:20px 0
}
.box{
background:white;
padding:10px 18px;
border-radius:8px
}
.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
max-width:350px;
margin:auto
}
button{
padding:15px;
border:0;
border-radius:8px;
background:#3157d5;
color:white;
font-size:17px;
cursor:pointer
}
.new{
margin:20px 5px
}
#message{
min-height:25px;
font-weight:bold
}
.home{
display:inline-block;
margin-top:10px;
padding:10px 18px;
background:#172033;
color:white;
text-decoration:none;
border-radius:7px
}
</style>
</head>

<body>

<nav>
<a href="index.html">MindSprint</a>
</nav>

<div class="container">

<h1>Arrow Puzzle</h1>
<p>Choose the direction shown by the arrow.</p>

<div class="info">
<div class="box">Score<br><b id="score">0</b></div>
<div class="box">Streak<br><b id="streak">0</b></div>
<div class="box">Best<br><b id="best">0</b></div>
</div>

<div id="arrow">↑</div>

<div class="buttons">
<button onclick="answer('up')">⬆ Up</button>
<button onclick="answer('right')">➡ Right</button>
<button onclick="answer('left')">⬅ Left</button>
<button onclick="answer('down')">⬇ Down</button>
</div>

<button class="new" onclick="newGame()">New Game</button>

<div id="message"></div>

<a class="home" href="index.html">← Back to MindSprint</a>

</div>

<script>

let directions=["up","right","down","left"];
let symbols={
up:"↑",
right:"→",
down:"↓",
left:"←"
};

let current="";
let score=0;
let streak=0;
let best=Number(localStorage.getItem("arrowBest")||0);

document.getElementById("best").textContent=best;

function newGame(){

score=0;
streak=0;

document.getElementById("score").textContent=0;
document.getElementById("streak").textContent=0;
document.getElementById("message").textContent="";

next();

}

function next(){

current=directions[
Math.floor(Math.random()*directions.length)
];

document.getElementById("arrow").textContent=symbols[current];

}

function answer(choice){

if(choice===current){

score++;
streak++;

document.getElementById("message").textContent="✅ Correct!";

}else{

streak=0;

document.getElementById("message").textContent="❌ Wrong!";

}

if(score>best){

best=score;
localStorage.setItem("arrowBest",best);

}

document.getElementById("score").textContent=score;
document.getElementById("streak").textContent=streak;
document.getElementById("best").textContent=best;

setTimeout(next,300);

}

newGame();

</script>

</body>
</html>
